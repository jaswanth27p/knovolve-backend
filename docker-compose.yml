services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knovolve
      POSTGRES_PASSWORD: knovolve
      POSTGRES_DB: knovolve
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
