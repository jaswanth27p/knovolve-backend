[project]
name = "knovolve-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "email-validator>=2.0",
    "tenacity>=9.0",
    "graphviz>=0.20",
    "boto3>=1.34",
    "opentelemetry-api>=1.31",
    "opentelemetry-sdk>=1.31",
    "opentelemetry-exporter-otlp>=1.31",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-requests>=0.52b0",
    "opentelemetry-instrumentation-httpx>=0.52b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.52b0",
    "opentelemetry-instrumentation-celery>=0.52b0",
    "opentelemetry-instrumentation-redis>=0.52b0",
    "prometheus-fastapi-instrumentator>=7.1",
    "sentry-sdk>=2.19",
    "jinja2>=3.1",
    "markdown>=3.7",
    "weasyprint>=65",
    "ddgs>=9.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pyright>=1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/__pycache__", "alembic/versions"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
